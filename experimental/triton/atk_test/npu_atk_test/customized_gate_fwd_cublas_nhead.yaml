# customized_gate_fwd_cublas_nhead 算子测试设计yaml
# 融合算子：Gate GEMM → Proj GEMM → fused clamp+SiLU+sum over heads+gate multiply+RMSNorm
# 输入：input (B, Din), gate_layer_weight (E, Din), gate_layer_bias (E,),
#       proj_weights (H, Din, head_size), proj_biases (H, Din), rms_norm_weight (Din,), eps
# 输出：output (B, Din)

name: customized_gate_fwd_cublas_nhead
api: pytorch
version: v2.1
api_type: customized_gate_fwd_cublas_nhead
triton_api_type: customized_gate_fwd_cublas_nhead
triton_name: triton_customized_gate_fwd_cublas_nhead.customized_gate_fwd_cublas_nhead
generate: generate_customized_gate_fwd_cublas_nhead
dtype_numbers: 150
outputs: 0
standard:
  acc: double_benchmark
  perf: not_key
inputs:
  - name: input
    type: tensor
    required: true
    dtypes:
      values: [ bf16 ]
    shapes:
      dim_numbers:
        values: [ 2 ]
      dim_values:
        values: [ [128, 256], [512, 1024], [2048, 4096], [4097, 8192] ]
        weights: [ 0.1, 0.2, 0.35, 0.35 ]
      max_length: 16777216
    ranges:
      valid:
        values: [ [-10, 10] ]
        random_types:
          - name: nd
            mean: [0, 1]
            std: [0.5, 2]
    align_32B: true
    boundary:
      has_empty: false
      has_infnan: true
      has_scalar: false
      has_upper_border: false
      has_lower_border: false

  - name: gate_layer_weight
    type: tensor
    required: true
    dtypes:
      values: [ bf16 ]
    shapes:
      dim_numbers:
        values: [ 2 ]
      dim_values:
        values: [ [64, 2048], [2049, 4096], [4097, 8192] ]
        weights: [ 0.25, 0.35, 0.4 ]
      max_length: 16777216
    ranges:
      valid:
        values: [ [-1, 1] ]
        random_types:
          - name: nd
            mean: [0, 1]
            std: [0.01, 0.5]
    align_32B: true
    boundary:
      has_empty: false
      has_infnan: false
      has_scalar: false
      has_upper_border: false
      has_lower_border: false

  - name: gate_layer_bias
    type: tensor
    required: true
    dtypes:
      values: [ bf16 ]
    shapes:
      dim_numbers:
        values: [ 1 ]
      dim_values:
        values: [ [64, 2048], [2049, 4096], [4097, 8192] ]
        weights: [ 0.25, 0.35, 0.4 ]
      max_length: 16777216
    ranges:
      valid:
        values: [ [-10, 10] ]
    align_32B: true
    boundary:
      has_empty: false
      has_infnan: false
      has_scalar: false
      has_upper_border: false
      has_lower_border: false

  - name: proj_weights
    type: tensor
    required: true
    dtypes:
      values: [ bf16 ]
    shapes:
      dim_numbers:
        values: [ 3 ]
      dim_values:
        - values: [ [1, 8] ]             # dim0: H (head num), 客户case H=4
        - values: [ [128, 256], [512, 1024], [2048, 4096], [4097, 8192] ]
          weights: [ 0.1, 0.2, 0.35, 0.35 ]   # dim1: Din, 与 CUDA 接口一致
        - values: [ [64, 1024] ]          # dim2: head_size (Dh), 客户case Dh=512
      max_length: 16777216
    align_32B: true
    ranges:
      valid:
        values: [ [-1, 1] ]
        random_types:
          - name: nd
            mean: [0, 1]
            std: [0.01, 0.5]
    boundary:
      has_empty: false
      has_infnan: false
      has_scalar: false
      has_upper_border: false
      has_lower_border: false

  - name: proj_biases
    type: tensor
    required: true
    dtypes:
      values: [ bf16 ]
    shapes:
      dim_numbers:
        values: [ 2 ]
      dim_values:
        - values: [ [1, 8] ]             # dim0: H (head num)
        - values: [ [128, 256], [512, 1024], [2048, 4096], [4097, 8192] ]
          weights: [ 0.1, 0.2, 0.35, 0.35 ]
      max_length: 16777216
    ranges:
      valid:
        values: [ [-10, 10] ]
    align_32B: true
    boundary:
      has_empty: false
      has_infnan: false
      has_scalar: false
      has_upper_border: false
      has_lower_border: false

  - name: rms_norm_weight
    type: tensor
    required: true
    dtypes:
      values: [ bf16 ]
    shapes:
      dim_numbers:
        values: [ 1 ]
      dim_values:
        values: [ [128, 256], [512, 1024], [2048, 4096], [4097, 8192] ]
        weights: [ 0.1, 0.2, 0.35, 0.35 ]
      max_length: 16777216
    align_32B: true
    ranges:
      valid:
        values: [ [0.1, 10.0] ]
    boundary:
      has_empty: false
      has_infnan: false
      has_scalar: false
      has_upper_border: false
      has_lower_border: false

  - name: eps
    type: scalar
    required: false
    dtypes:
      values: [ float ]
    ranges:
      valid:
        values: [ [0.000001, 0.0001] ]
