# _rms_norm_bwd_dwdb 算子测试设计yaml
# 用于将 _dweight 累加得到 dweight
# DW由Generator从一维变为二维 [GROUP_N, num_heads]
# 输出：FINAL_DW [num_heads], FINAL_DB [num_heads]
name: _rms_norm_bwd_dwdb
api: pytorch
version: v2.1
api_type: _rms_norm_bwd_dwdb
generate: generate_rms_norm_bwd_dwdb
dtype_numbers: 3334
outputs: 1
standard:
  acc: single_bm
  perf: not_key
inputs:
  - name: DW
    type: tensor
    required: true
    dtypes:
      values: [fp32, fp16, bf16]
    ranges:
      valid:
        values: [[-100.0, 100.0]]
    shapes:
      dim_numbers:
        values: [2]
      dim_values:
        values: [[2, 1024], [2049, 4096], [4097, 8192]]
        weights: [0.60, 0.25, 0.15]
      max_length: 67108864
    boundary:
      has_empty: false
      has_infnan: false
      has_scalar: false
      has_upper_border: false
      has_lower_border: false

  - name: FINAL_DW
    type: tensor
    required: true
    dtypes:
      values: [fp32, fp16, bf16]
    ranges:
      valid:
        values: [[-100.0, 100.0]]
    shapes:
      dim_numbers:
        values: [1]
      # 1D tensor: 单维度的范围选项
      dim_values:
        values: [ [2, 1024], [2049, 4096], [4097, 8192] ]
        weights: [0.60, 0.25, 0.15]
      max_length: 67108864
    boundary:
      has_empty: false
      has_infnan: false
      has_scalar: false
      has_upper_border: false
      has_lower_border: false
