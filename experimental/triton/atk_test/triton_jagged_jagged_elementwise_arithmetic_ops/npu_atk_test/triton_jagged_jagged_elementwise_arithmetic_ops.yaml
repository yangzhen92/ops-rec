# triton_jagged_jagged_elementwise_arithmetic_ops.yaml
# 对两个相同 shape 的 jagged tensor 进行逐元素算术运算
# Kernel: jagged_jagged_elementwise_arithmetic_ops
# 输入: x_values [M, N], y_values [M, N]
# 输出: output [M, N]
name: triton_jagged_jagged_elementwise_arithmetic_ops
api: pytorch
version: v2.1
api_type: triton_jagged_jagged_elementwise_arithmetic_ops
triton_api_type: triton_jagged_jagged_elementwise_arithmetic_ops
triton_name: triton_jagged_tensor_ops.jagged_jagged_elementwise_arithmetic_ops
generate: generate_triton_jagged_jagged_elementwise_arithmetic_ops
dtype_numbers: 50
outputs: 0
standard:
  acc: single_bm
  perf: not_key

inputs:
  # x_values: 第一个 jagged tensor 的 values
  - name: x_values
    type: tensor
    required: true
    dtypes:
      values: [ fp32, fp16, bf16 ]
    shapes:
      dim_numbers:
        values: [ 2 ]
      dim_values:
        values: [ [2, 1024], [2049, 4096], [4007, 8192] ]  # 标量池
        weights: [ 0.3, 0.3, 0.4 ]  # 30%小(2-1024) + 30%中(2049-4096) + 40%大(4007-8192)
    ranges:
      valid:
        values: [ [-100, 100] ]
        random_types:
          - name: nd
            mean: [0, 50]
            std: [1, 10]
      invalid:
        values: [ [-100, 100] ]
    boundary:
      has_empty: false
      has_infnan: true
      has_scalar: false
      has_upper_border: false
      has_lower_border: false

  # y_values: 第二个 jagged tensor 的 values
  - name: y_values
    type: tensor
    required: true
    dtypes:
      values: [ fp32, fp16, bf16 ]
    shapes:
      dim_numbers:
        values: [ 2 ]
      dim_values:
        values: [ [2, 1024], [2049, 4096], [4007, 8192] ]  # 标量池
        weights: [ 0.3, 0.3, 0.4 ]  # 30%小(2-1024) + 30%中(2049-4096) + 40%大(4007-8192)
    ranges:
      valid:
        values: [ [-100, 100] ]
        random_types:
          - name: nd
            mean: [0, 50]
            std: [1, 10]
      invalid:
        values: [ [-100, 100] ]
    boundary:
      has_empty: false
      has_infnan: true
      has_scalar: false
      has_upper_border: false
      has_lower_border: false
