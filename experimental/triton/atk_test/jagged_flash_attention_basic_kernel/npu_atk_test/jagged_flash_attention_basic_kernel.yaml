inputs:
  # q: [total_seq, D]（对齐原生：D=integers(16,64)，total_seq 取中段 [128,512]）
  - {name: q, type: tensor, required: true, dtypes: {values: [bf16, fp16, fp32]}, shapes: {dim_numbers: {values: [2]}, dim_values: {values: [[128, 512], [32, 128]], weights: [0.6, 0.4]}}}
  # k: [D, total_seq]（转置形式）
  - {name: k, type: tensor, required: true, dtypes: {values: [bf16, fp16, fp32]}, shapes: {dim_numbers: {values: [2]}, dim_values: {values: [[32, 128], [128, 512]], weights: [0.4, 0.6]}}}
  # v: [total_seq, D]
  - {name: v, type: tensor, required: true, dtypes: {values: [bf16, fp16, fp32]}, shapes: {dim_numbers: {values: [2]}, dim_values: {values: [[128, 512], [32, 128]], weights: [0.6, 0.4]}}}
  # offset: [B+1] jagged offset（B=4~10，对齐原生 integers(1,10) 中段）
  - {name: offset, type: tensor, required: true, dtypes: {values: [int64]}, shapes: {dim_numbers: {values: [1]}, dim_values: {values: [[5, 11]], weights: [1.0]}}}
  # max_seq_len: 最大序列长度（对齐原生 integers(1,100) 中高段 [32,128]）
  - {name: max_seq_len, type: attr, required: true, dtypes: {values: [int]}, ranges: {valid: {values: [[32, 128]], weights: [1.0]}}}
  # use_mask: 是否因果 mask（bool attr 必须用字符串候选值，避免 ATK 按数值区间处理）
  - {name: use_mask, type: attr, required: false, dtypes: {values: [bool]}, ranges: {valid: {values: ["false", "true"], weights: [0.7, 0.3]}}}
  # allow_tf32: 是否允许 TF32
  - {name: allow_tf32, type: attr, required: false, dtypes: {values: [bool]}, ranges: {valid: {values: ["false", "true"], weights: [0.5, 0.5]}}}
  # BLOCK_SIZE_M/N/D: block size 档位（16/32；去掉 64+ 避免 shared memory 溢出）
  - {name: BLOCK_SIZE_M, type: attr, required: false, dtypes: {values: [int]}, ranges: {valid: {values: [[16, 16], [32, 32]], weights: [0.4, 0.6]}}}
  - {name: BLOCK_SIZE_N, type: attr, required: false, dtypes: {values: [int]}, ranges: {valid: {values: [[16, 16], [32, 32]], weights: [0.4, 0.6]}}}
  - {name: BLOCK_SIZE_D, type: attr, required: false, dtypes: {values: [int]}, ranges: {valid: {values: [[16, 16], [32, 32]], weights: [0.4, 0.6]}}}
