    <!-- ========== 3. 注意力 mask 矩阵 ========== -->
    <text x="80" y="582" class="subtitle">3. 对应的注意力 mask 矩阵（query × key，蓝=Seq0 可见 / 绿=Seq1 可见 / 灰=不可见）</text>
    <text x="305" y="600" text-anchor="middle" class="label">key (pos)</text>
    <text x="160" y="750" text-anchor="middle" class="label" transform="rotate(-90,140,750)">query (pos)</text>

    <g transform="translate(0, 10)">
        <!-- 每行: 隐藏前缀 + 可见上三角带(序列色) + 隐藏后缀 -->
