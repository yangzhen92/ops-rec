# _bwd_preprocess_do_o_dot.yaml
# _bwd_preprocess_do_o_dot 算子用例设计文件
# 用于 Flash Attention 反向传播预处理步骤
# 输入：Out [B, T, D], do [B, T, D]
# 输出：delta [B, T] = sum(Out * do, axis=1)
name: _bwd_preprocess_do_o_dot
api: pytorch
version: v2.1
api_type: _bwd_preprocess_do_o_dot
triton_api_type: _bwd_preprocess_do_o_dot
triton_name: _bwd_preprocess_do_o_dot
generate: generate_bwd_preprocess_do_o_dot
dtype_numbers: 3334
outputs: 0
standard:
  acc: double_benchmark # 采用双标杆
  perf: not_key
inputs:
  - name: Out
    type: tensor
    required: true
    dtypes:
      values: [ fp32, fp16, bf16 ]
    ranges:
      valid:
        values: [ [-10000, 10000] ]
        random_types:
          - name: nd
            mean: [0, 5000]
            std: [1, 500]
    shapes:
      dim_numbers:
        values: [ 3 ]
      dim_values:
        values: [ [4, 10], [10, 100], [100, 300] ]
        weights: [ 0.1, 0.2, 0.7]
      max_length: 27000000
    boundary:
      has_empty: false
      has_infnan: true
      has_scalar: false
      has_upper_border: false
      has_lower_border: false

  - name: do
    type: tensor
    required: true
    dtypes:
      values: [ fp32, fp16, bf16 ]
    ranges:
      valid:
        values: [ [-10000, 10000] ]
        random_types:
          - name: nd
            mean: [0, 5000]
            std: [1, 500]
    shapes:
      dim_numbers:
        values: [ 3 ]
      dim_values:
        values: [ [4, 10], [10, 50], [50, 80] ]
        weights: [ 0.1, 0.2, 0.7]
      max_length: 40960000
    boundary:
      has_empty: false
      has_infnan: true
      has_scalar: false
      has_upper_border: false
      has_lower_border: false
