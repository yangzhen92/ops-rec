    <rect width="100%" height="100%" fill="#f7f9fb"/>
    <text x="490" y="32" text-anchor="middle" class="title">build_upper_triangular_mask_arbitrary_func：上三角掩码 af 编码与注意力 mask 对应关系</text>
    <text x="490" y="56" text-anchor="middle" class="subtitle">示例: batch=2, offsets=[0,5,12], total_seqlen=12</text>

    <!-- ========== 1. 序列分块 ========== -->
    <text x="80" y="88" class="subtitle">1. 序列分块（上三角按序列内独立计算）</text>

    <!-- Seq0 / Seq1 序列条 -->
    <text x="170" y="105" text-anchor="middle" class="small">Seq 0 (len=5)  全局 [0,5)</text>
    <text x="386" y="105" text-anchor="middle" class="small">Seq 1 (len=7)  全局 [5,12)</text>
    <rect x="80" y="110" width="180" height="26" class="segA" rx="2"/>
    <rect x="80" y="110" width="180" height="26" fill="none" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="170" y="128" text-anchor="middle" style="font:bold 12px Arial,sans-serif;fill:white">Seq 0</text>
    <rect x="260" y="110" width="252" height="26" class="segC" rx="2"/>
    <rect x="260" y="110" width="252" height="26" fill="none" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="386" y="128" text-anchor="middle" style="font:bold 12px Arial,sans-serif;fill:white">Seq 1</text>

    <g class="small" text-anchor="middle">
        <text x="98" y="154">0</text><text x="134" y="154">1</text><text x="170" y="154">2</text>
        <text x="206" y="154">3</text><text x="242" y="154">4</text><text x="278" y="154">5</text>
        <text x="314" y="154">6</text><text x="350" y="154">7</text><text x="386" y="154">8</text>
        <text x="422" y="154">9</text><text x="458" y="154">10</text><text x="494" y="154">11</text>
    </g>

