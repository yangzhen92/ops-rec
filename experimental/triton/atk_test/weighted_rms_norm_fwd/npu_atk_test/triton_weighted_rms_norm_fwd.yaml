# 该 kernel 对 X [N, D] 的每一行做 RMS Norm，并乘上 weight：
#   y[i,j] = x[i,j] / sqrt(mean(x[i,:]^2) + eps) * w[j]
#
# 输入参数：
#   X: [N, D]    输入
#   W: [D]       weight（每列一个标量）
#   Rstd: [N]    输出：rstd（仅输出 buffer，kernel 不读取）
#   Y: [N, D]    输出：归一化结果（与 X 同 dtype）
#   D: int       特征维
#   eps: float   归一化 epsilon
