name: array_jagged_bmm_kernel
api: pytorch
version: v2.1
api_type: array_jagged_bmm_kernel
triton_api_type: array_jagged_bmm_kernel
triton_name: triton_jagged_bmm_jagged_out.array_jagged_bmm_kernel
generate: generate_array_jagged_bmm_kernel
dtype_numbers: 3334
outputs: 0
standard:
  acc: double_benchmark
  perf: not_key

inputs:
  - name: array_A
    type: tensor
    required: true
    dtypes:
      values: [ fp32, fp16, bf16 ]
    shapes:
      dim_numbers:
        values: [ 1 ]
      dim_values:
        values: [ [2048, 8192], [8193, 16384] ]
        weights: [ 0.5, 0.5 ]  # Generator 覆盖为 Σseq²
    ranges:
      valid:
        values: [ [-1, 1] ]  # fp16 累加 ≤37400 < 65504，安全
        random_types:
          - name: nd
            mean: [0, 0.5]
            std: [0.1, 1]
    boundary:
      has_empty: false
      has_infnan: false  # 对 inf/nan 敏感
      has_scalar: false
      has_upper_border: false
      has_lower_border: false
  - name: jagged_B
    type: tensor
    required: true
    dtypes:
      values: [ fp32, fp16, bf16 ]
    shapes:
      dim_numbers:
        values: [ 2 ]
      dim_values:
        values: [ [512, 1024], [1025, 2048] ]
        weights: [ 0.5, 0.5 ]
    ranges:
      valid:
        values: [ [-100, 100] ]
        random_types:
          - name: nd
            mean: [0, 50]
            std: [1, 10]
    boundary:
      has_empty: false
      has_infnan: false
      has_scalar: false
      has_upper_border: false
      has_lower_border: false
  - name: offsets_am
    type: tensor
    required: true
    dtypes:
      values: [ int32 ]  # 对齐官方测试
    shapes:
      dim_numbers:
        values: [ 1 ]
      dim_values:
        values: [ 3, 5, 9, 17 ]
        weights: [ 0.1, 0.2, 0.35, 0.35 ]
    ranges:
      valid:
        values: [ [0, 131071] ]
    boundary:
      has_empty: false
      has_infnan: false
      has_scalar: false
      has_upper_border: false
      has_lower_border: false
  - name: offsets_bk
    type: tensor
    required: true
    dtypes:
      values: [ int32 ]
    shapes:
      dim_numbers:
        values: [ 1 ]
      dim_values:
        values: [ 3, 5, 9, 17 ]
        weights: [ 0.1, 0.2, 0.35, 0.35 ]
    ranges:
      valid:
        values: [ [0, 3071] ]
    boundary:
      has_empty: false
      has_infnan: false
      has_scalar: false
      has_upper_border: false
      has_lower_border: false
  - name: offsets_cm
    type: tensor
    required: true
    dtypes:
      values: [ int32 ]
    shapes:
      dim_numbers:
        values: [ 1 ]
      dim_values:
        values: [ 3, 5, 9, 17 ]
        weights: [ 0.1, 0.2, 0.35, 0.35 ]
    ranges:
      valid:
        values: [ [0, 3071] ]
    boundary:
      has_empty: false
      has_infnan: false
      has_scalar: false
      has_upper_border: false
      has_lower_border: false
  - name: max_seq_len
    type: attrs
    required: true
    dtypes:
      values: [ int ]
    ranges:
      valid:
        values: [ [192, 384] ]
