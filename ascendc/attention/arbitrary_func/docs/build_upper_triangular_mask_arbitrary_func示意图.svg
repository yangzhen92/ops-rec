<svg xmlns="http://www.w3.org/2000/svg" width="980" height="920" viewBox="0 0 980 920">
    <defs><style>
        .title{font:bold 22px Arial,sans-serif;fill:#203040}.subtitle{font:14px Arial,sans-serif;fill:#52616b}.label{font:13px Arial,sans-serif;fill:#203040}.small{font:11px Arial,sans-serif;fill:#52616b}.formula{font:12px Consolas,monospace;fill:#203040}.segA{fill:#3b82f6}.segC{fill:#10b981}.segD{fill:#ef4444}.visA{fill:#3b82f6}.visC{fill:#10b981}.visible{fill:#22c55e}.hidden{fill:#eef2f7}.grid{stroke:#cbd5e1;stroke-width:1}.boundary{stroke:#2c3e50;stroke-width:2}
