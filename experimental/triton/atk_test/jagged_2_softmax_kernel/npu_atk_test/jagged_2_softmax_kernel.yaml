name: jagged_2_softmax_kernel
api: pytorch
version: v2.1
api_type: jagged_2_softmax_kernel
triton_api_type: jagged_2_softmax_kernel
triton_name: triton_jagged_softmax.jagged_2_softmax_kernel
generate: generate_jagged_2_softmax_kernel
dtype_numbers: 3334
outputs: 0
standard:
  acc: single_bm
  perf: not_key

inputs:
  # input_x: [sum(seq_len²)] - 长度由 Generator 覆盖；值用 ATK 采样数据
  - name: input_x
    type: tensor
    required: true
    dtypes:
      values: [ fp32, fp16, bf16 ]
    shapes:
      dim_numbers:
        values: [ 1 ]
      dim_values:
        values: [ [2, 1024], [2049, 4096], [4097, 8192] ]
        weights: [ 0.3, 0.3, 0.4 ]  # 占位，Generator按Σseq_len²覆盖
    ranges:
      valid:
        values: [ [-100, 100] ]
        # std≤2 避免 fp16 下溢把 softmax 退化成 one-hot；mean≤5 避开 fp16 量化间隔
        random_types:
          - name: nd
            mean: [0, 5]
            std: [1, 2]
      invalid:
        values: [ [-100, 100] ]
    boundary:
      has_empty: false
      has_infnan: false
      has_scalar: false
      has_upper_border: false
      has_lower_border: false

  # offsets_row: [B+1] - 定 B 的旋钮，Generator 覆盖为 B+1，dim_values 仅占位长度
  # B ∈ {1,3,5,7,10,15}：覆盖原生 B=integers(1,10)，15 为大 batch 压力点
  - name: offsets_row
    type: tensor
    required: true
    dtypes:
      values: [ int32 ]
    shapes:
      dim_numbers:
        values: [ 1 ]
      dim_values:
        values: [ 2, 4, 6, 8, 11, 16 ]  # 占位，Generator覆盖为B+1；B=1/3/5/7/10/15
        weights: [ 0.02, 0.04, 0.06, 0.18, 0.28, 0.42 ]  # 极小2%:小10%:中18%:大70%
    ranges:
      valid:
        values: [ [0, 65535] ]
      invalid:
        values: [ [0, 65535] ]
    boundary:
      has_empty: false

  # offsets_col: [B+1] - 与 offsets_row 相同（方阵 row=col），长度同步覆盖为 B+1
  - name: offsets_col
    type: tensor
    required: true
    dtypes:
      values: [ int32 ]
    shapes:
      dim_numbers:
        values: [ 1 ]
      dim_values:
        values: [ 2, 4, 6, 8, 11, 16 ]
        weights: [ 0.02, 0.04, 0.06, 0.18, 0.28, 0.42 ]  # 极小2%:小10%:中18%:大70%
    ranges:
      valid:
        values: [ [0, 65535] ]
      invalid:
        values: [ [0, 65535] ]
    boundary:
      has_empty: false

  # offsets_overall: [B+1] - API 用 shape[0]-1 定 B，是唯一被消费的 offset 元数据
  - name: offsets_overall
    type: tensor
    required: true
    dtypes:
      values: [ int32 ]
    shapes:
      dim_numbers:
        values: [ 1 ]
      dim_values:
        values: [ 2, 4, 6, 8, 11, 16 ]
        weights: [ 0.02, 0.04, 0.06, 0.18, 0.28, 0.42 ]  # 极小2%:小10%:中18%:大70%
    ranges:
      valid:
        values: [ [0, 2097151] ]  # seq_len²可达大值，ranges放宽
      invalid:
        values: [ [0, 2097151] ]
    boundary:
      has_empty: false

  # max_seq_len_row / max_seq_len_col 已移除：ATK 无法注入标量值，kernel 用值由 API 从 B 重算

  # transpose: 标量int（0或1），ATK不支持bool，用int替代
  - name: transpose
    type: attrs
    required: true
    dtypes:
      values: [ int ]
    ranges:
      valid:
        values: [ 0, 1 ]
      invalid:
        values: [ 0, 1 ]
