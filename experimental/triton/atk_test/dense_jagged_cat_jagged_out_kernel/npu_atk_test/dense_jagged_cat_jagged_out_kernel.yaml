name: dense_jagged_cat_jagged_out_kernel
api: pytorch
version: v2.1
api_type: dense_jagged_cat_jagged_out_kernel
triton_api_type: dense_jagged_cat_jagged_out_kernel
triton_name: triton_dense_jagged_cat_jagged_out.dense_jagged_cat_jagged_out_kernel
generate: generate_dense_jagged_cat_jagged_out_kernel
dtype_numbers: 50
outputs: 0
standard:
  acc: single_bm
  perf: not_key

inputs:
  # a_ptr: dense tensor [B] - 每个batch一个标量
  - name: a_ptr
    type: tensor
    required: true
    dtypes:
      values: [ fp32, fp16, bf16 ]
    shapes:
      dim_numbers:
        values: [ 1 ]
      dim_values:
        values: [ 3, 5, 9, 17, 33, 65 ]
        weights: [ 0.1, 0.15, 0.2, 0.25, 0.2, 0.1 ]
    ranges:
      valid:
        values: [ [-100, 100] ]
        random_types:
          - name: nd
            mean: [0, 50]
            std: [1, 10]
    boundary:
      has_empty: false
      has_infnan: false
      has_scalar: false
      has_upper_border: false
      has_lower_border: false

  # b_ptr: jagged tensor [sum(seq_len)]
  - name: b_ptr
    type: tensor
    required: true
    dtypes:
      values: [ fp32, fp16, bf16 ]
    shapes:
      dim_numbers:
        values: [ 1 ]
      dim_values:
        values: [ [256, 3072], [3073, 6144], [6145, 12288] ]
        weights: [ 0.3, 0.4, 0.3 ]
    ranges:
      valid:
        values: [ [-100, 100] ]
        random_types:
          - name: nd
            mean: [0, 50]
            std: [1, 10]
    boundary:
      has_empty: false
      has_infnan: false
      has_scalar: false
      has_upper_border: false
      has_lower_border: false

  # b_offsets_ptr: [B+1] - b的seq_len cumsum
  - name: b_offsets_ptr
    type: tensor
    required: true
    dtypes:
      values: [ int32 ]
    shapes:
      dim_numbers:
        values: [ 1 ]
      dim_values:
        values: [ 3, 5, 9, 17, 33, 65 ]
        weights: [ 0.1, 0.15, 0.2, 0.25, 0.2, 0.1 ]
    ranges:
      valid:
        values: [ [0, 65535] ]
    boundary:
      has_empty: false

  # max_seq_len: 标量int
  - name: max_seq_len
    type: attrs
    required: true
    dtypes:
      values: [ int ]
    ranges:
      valid:
        values: [ [256, 1024], [1025, 2048], [2049, 4096] ]
        weights: [ 0.3, 0.4, 0.3 ]
