    <!-- ========== 图例 ========== -->
    <text x="530" y="610" class="subtitle">图例</text>
    <rect x="530" y="622" width="18" height="18" class="visA"/>
    <text x="556" y="636" class="label">Seq 0 可见块（key &gt;= pos，上三角）</text>
    <rect x="530" y="646" width="18" height="18" class="visC"/>
    <text x="556" y="660" class="label">Seq 1 可见块（key &gt;= pos，上三角）</text>
    <rect x="530" y="670" width="18" height="18" class="hidden"/>
    <text x="556" y="684" class="label">不可见（其他序列 / 本序列 key &lt; pos）</text>

    <!-- ========== 编码规则 ========== -->
    <text x="530" y="766" class="subtitle">编码规则</text>
    <text x="530" y="788" class="small">· 二分查找 offsets 定位 pos 所属 seq_id</text>
    <text x="530" y="806" class="small">· col0 = pos（全局坐标）</text>
    <text x="530" y="824" class="small">· col1 = offsets[seq_id + 1]（序列末尾）</text>
    <text x="530" y="842" class="small">· 可见 key = [col0, col1)：本序列内 key &gt;= pos</text>
    <text x="530" y="862" class="small">· 上三角掩码，含对角线自身</text>
</svg>