name: _jagged_flash_attention_bwd_preprocess_basic_kernel
api: pytorch
version: v2.1
api_type: _jagged_flash_attention_bwd_preprocess_basic_kernel
dtype_numbers: 50
outputs: 0
standard:
  acc: double_benchmark
  perf: not_key
triton_api_type: _jagged_flash_attention_bwd_preprocess_basic_kernel
triton_name: triton_jagged_flash_attention_basic._jagged_flash_attention_bwd_preprocess_basic_kernel
generate: generate__jagged_flash_attention_bwd_preprocess_basic_kernel

inputs:
  # o_ptr: 输出张量 [total_seq, D]
  # 必须用 listmode 避免 D 抽到 512 导致 UB 溢出
  # dim0=total_seq∈[128,512]; dim1=D∈[32,128]
  - name: o
    type: tensor
    required: true
    dtypes:
      values: [bf16, fp16, fp32]
    shapes:
      dim_numbers:
        values: [2]
      dim_values:
        - values: [[128, 512]]   # dim0: total_seq
        - values: [[32, 128]]    # dim1: D

  # do_ptr: 输出梯度 [total_seq, D]
  - name: do
    type: tensor
    required: true
    dtypes:
      values: [bf16, fp16, fp32]
    shapes:
      dim_numbers:
        values: [2]
      dim_values:
        - values: [[128, 512]]   # dim0: total_seq
        - values: [[32, 128]]    # dim1: D

  # o_offset_ptr: jagged offset [B+1]
  - name: o_offset
    type: tensor
    required: true
    dtypes:
      values: [int64]
    shapes:
      dim_numbers:
        values: [1]
      dim_values:
        values: [[3, 17], [17, 33]]

  # max_seq_len: 最大序列长度
  # 对齐原生测试(FBGEMM): max_L=integers(1,100)
  - name: max_seq_len
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [[16, 128]]

  # BLOCK_SIZE_M: block size for M dimension
  # 原生固定 32，保留 16/32
  - name: BLOCK_SIZE_M
    type: attr
    required: false
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [[16, 16], [32, 32]]

  # BLOCK_SIZE_D: block size for D dimension
  # 去掉 64/128 避免 shared memory 溢出
  - name: BLOCK_SIZE_D
    type: attr
    required: false
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [[16, 16], [32, 32]]