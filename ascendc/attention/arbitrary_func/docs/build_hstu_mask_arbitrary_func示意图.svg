<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #34495e; }
      .label { font-family: Arial, sans-serif; font-size: 13px; fill: #2c3e50; }
      .small { font-family: Arial, sans-serif; font-size: 11px; fill: #7f8c8d; }
      .ctx { fill: #3498db; }
      .hist { fill: #2ecc71; }
      .tgt { fill: #e74c3c; }
      .visible { fill: #27ae60; }
      .hidden { fill: #ecf0f1; }
      .grid { stroke: #bdc3c7; stroke-width: 1; }
      .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .region-box { stroke: #2c3e50; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="500" y="35" text-anchor="middle" class="title">build_hstu_mask_arbitrary_func: af编码 与 注意力mask对应关系示例</text>
  <text x="500" y="58" text-anchor="middle" class="small">示例: batch=1, ctx_len=2, hist_len=2, tgt_len=2, total_seqlen=6, target_group_size=2</text>

  <!-- ========== 第一部分：序列区域划分 ========== -->
  <text x="50" y="90" class="subtitle">1. 序列区域划分 (位置 0~5)</text>
  
  <!-- 位置轴 -->
  <line x1="80" y1="130" x2="620" y2="130" stroke="#2c3e50" stroke-width="2"/>
  <g>
    <!-- 位置标记 -->
    <g transform="translate(100,130)">
      <line y1="-5" y2="5" stroke="#2c3e50" stroke-width="2"/>
      <text y="25" text-anchor="middle" class="label">0</text>
    </g>
    <g transform="translate(180,130)">
      <line y1="-5" y2="5" stroke="#2c3e50" stroke-width="2"/>
      <text y="25" text-anchor="middle" class="label">1</text>
    </g>
    <g transform="translate(260,130)">
      <line y1="-5" y2="5" stroke="#2c3e50" stroke-width="2"/>
      <text y="25" text-anchor="middle" class="label">2</text>
    </g>
    <g transform="translate(340,130)">
      <line y1="-5" y2="5" stroke="#2c3e50" stroke-width="2"/>
      <text y="25" text-anchor="middle" class="label">3</text>
    </g>
    <g transform="translate(420,130)">
      <line y1="-5" y2="5" stroke="#2c3e50" stroke-width="2"/>
      <text y="25" text-anchor="middle" class="label">4</text>
    </g>
    <g transform="translate(500,130)">
      <line y1="-5" y2="5" stroke="#2c3e50" stroke-width="2"/>
      <text y="25" text-anchor="middle" class="label">5</text>
    </g>
  </g>

  <!-- Context 区域 -->
  <rect x="80" y="105" width="140" height="20" class="ctx" rx="3"/>
  <text x="150" y="120" text-anchor="middle" fill="white" font-weight="bold" font-size="12">Context (ctx_len=2)</text>
  
  <!-- History 区域 -->
  <rect x="220" y="105" width="140" height="20" class="hist" rx="3"/>
  <text x="290" y="120" text-anchor="middle" fill="white" font-weight="bold" font-size="12">History (hist_len=2)</text>
  
  <!-- Target 区域 -->
  <rect x="360" y="105" width="140" height="20" class="tgt" rx="3"/>
  <text x="430" y="120" text-anchor="middle" fill="white" font-weight="bold" font-size="12">Target (tgt_len=2)</text>

  <!-- 标注base位置 -->
  <line x1="360" y1="95" x2="360" y2="145" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="365" y="90" class="label" fill="#e74c3c">base=4 (target起始位置)</text>

  <!-- ========== 第二部分：af编码表 ========== -->
  <text x="50" y="180" class="subtitle">2. af (arbitrary function) 编码表: af[pos] = [col0, col1, col2, col3]</text>
  <text x="50" y="200" class="small">每个位置编码1~2个可见区间: [col0, col1) ∪ (col2>0 ? [col2, col3) : ∅)</text>

  <!-- 表格 -->
  <g transform="translate(50,215)">
    <!-- 表头 -->
    <rect x="0" y="0" width="70" height="30" fill="#34495e"/>
    <text x="35" y="20" text-anchor="middle" fill="white" font-weight="bold" class="label">pos</text>
    <rect x="70" y="0" width="70" height="30" fill="#34495e"/>
    <text x="105" y="20" text-anchor="middle" fill="white" font-weight="bold" class="label">col0</text>
    <rect x="140" y="0" width="70" height="30" fill="#34495e"/>
    <text x="175" y="20" text-anchor="middle" fill="white" font-weight="bold" class="label">col1</text>
    <rect x="210" y="0" width="70" height="30" fill="#34495e"/>
    <text x="245" y="20" text-anchor="middle" fill="white" font-weight="bold" class="label">col2</text>
    <rect x="280" y="0" width="70" height="30" fill="#34495e"/>
    <text x="315" y="20" text-anchor="middle" fill="white" font-weight="bold" class="label">col3</text>
    <rect x="350" y="0" width="300" height="30" fill="#34495e"/>
    <text x="500" y="20" text-anchor="middle" fill="white" font-weight="bold" class="label">可见区间</text>

    <!-- 行0: Context -->
    <rect x="0" y="30" width="70" height="35" class="ctx" opacity="0.3"/>
    <text x="35" y="53" text-anchor="middle" class="label">0</text>
    <rect x="70" y="30" width="70" height="35" fill="#f8f9fa"/>
    <text x="105" y="53" text-anchor="middle" class="label">0</text>
    <rect x="140" y="30" width="70" height="35" fill="#f8f9fa"/>
    <text x="175" y="53" text-anchor="middle" class="label">4</text>
    <rect x="210" y="30" width="70" height="35" fill="#f8f9fa"/>
    <text x="245" y="53" text-anchor="middle" class="label">0</text>
    <rect x="280" y="30" width="70" height="35" fill="#f8f9fa"/>
    <text x="315" y="53" text-anchor="middle" class="label">0</text>
    <rect x="350" y="30" width="300" height="35" fill="#f8f9fa"/>
    <text x="500" y="53" text-anchor="middle" class="label">[0, 4) → 可见key: 0,1,2,3</text>

    <!-- 行1: Context -->
    <rect x="0" y="65" width="70" height="35" class="ctx" opacity="0.3"/>
    <text x="35" y="88" text-anchor="middle" class="label">1</text>
    <rect x="70" y="65" width="70" height="35" fill="#f8f9fa"/>
    <text x="105" y="88" text-anchor="middle" class="label">0</text>
    <rect x="140" y="65" width="70" height="35" fill="#f8f9fa"/>
    <text x="175" y="88" text-anchor="middle" class="label">4</text>
    <rect x="210" y="65" width="70" height="35" fill="#f8f9fa"/>
    <text x="245" y="88" text-anchor="middle" class="label">0</text>
    <rect x="280" y="65" width="70" height="35" fill="#f8f9fa"/>
    <text x="315" y="88" text-anchor="middle" class="label">0</text>
    <rect x="350" y="65" width="300" height="35" fill="#f8f9fa"/>
    <text x="500" y="88" text-anchor="middle" class="label">[0, 4) → 可见key: 0,1,2,3</text>

    <!-- 行2: History -->
    <rect x="0" y="100" width="70" height="35" class="hist" opacity="0.3"/>
    <text x="35" y="123" text-anchor="middle" class="label">2</text>
    <rect x="70" y="100" width="70" height="35" fill="#f8f9fa"/>
    <text x="105" y="123" text-anchor="middle" class="label">0</text>
    <rect x="140" y="100" width="70" height="35" fill="#f8f9fa"/>
    <text x="175" y="123" text-anchor="middle" class="label">3</text>
    <rect x="210" y="100" width="70" height="35" fill="#f8f9fa"/>
    <text x="245" y="123" text-anchor="middle" class="label">0</text>
    <rect x="280" y="100" width="70" height="35" fill="#f8f9fa"/>
    <text x="315" y="123" text-anchor="middle" class="label">0</text>
    <rect x="350" y="100" width="300" height="35" fill="#f8f9fa"/>
    <text x="500" y="123" text-anchor="middle" class="label">[0, 3) → 可见key: 0,1,2</text>

    <!-- 行3: History -->
    <rect x="0" y="135" width="70" height="35" class="hist" opacity="0.3"/>
    <text x="35" y="158" text-anchor="middle" class="label">3</text>
    <rect x="70" y="135" width="70" height="35" fill="#f8f9fa"/>
    <text x="105" y="158" text-anchor="middle" class="label">0</text>
    <rect x="140" y="135" width="70" height="35" fill="#f8f9fa"/>
    <text x="175" y="158" text-anchor="middle" class="label">4</text>
    <rect x="210" y="135" width="70" height="35" fill="#f8f9fa"/>
    <text x="245" y="158" text-anchor="middle" class="label">0</text>
    <rect x="280" y="135" width="70" height="35" fill="#f8f9fa"/>
    <text x="315" y="158" text-anchor="middle" class="label">0</text>
    <rect x="350" y="135" width="300" height="35" fill="#f8f9fa"/>
    <text x="500" y="158" text-anchor="middle" class="label">[0, 4) → 可见key: 0,1,2,3</text>

    <!-- 行4: Target (group 0, tgt_idx=0) -->
    <rect x="0" y="170" width="70" height="35" class="tgt" opacity="0.3"/>
    <text x="35" y="193" text-anchor="middle" class="label">4</text>
    <rect x="70" y="170" width="70" height="35" fill="#f8f9fa"/>
    <text x="105" y="193" text-anchor="middle" class="label">0</text>
    <rect x="140" y="170" width="70" height="35" fill="#f8f9fa"/>
    <text x="175" y="193" text-anchor="middle" class="label">4</text>
    <rect x="210" y="170" width="70" height="35" fill="#f8f9fa"/>
    <text x="245" y="193" text-anchor="middle" class="label">4</text>
    <rect x="280" y="170" width="70" height="35" fill="#f8f9fa"/>
    <text x="315" y="193" text-anchor="middle" class="label">5</text>
    <rect x="350" y="170" width="300" height="35" fill="#f8f9fa"/>
    <text x="500" y="193" text-anchor="middle" class="label">[0,4) ∪ [4,5) → 可见key: 0,1,2,3,4</text>

    <!-- 行5: Target (group 0, tgt_idx=1) -->
    <rect x="0" y="205" width="70" height="35" class="tgt" opacity="0.3"/>
    <text x="35" y="228" text-anchor="middle" class="label">5</text>
    <rect x="70" y="205" width="70" height="35" fill="#f8f9fa"/>
    <text x="105" y="228" text-anchor="middle" class="label">0</text>
    <rect x="140" y="205" width="70" height="35" fill="#f8f9fa"/>
    <text x="175" y="228" text-anchor="middle" class="label">4</text>
    <rect x="210" y="205" width="70" height="35" fill="#f8f9fa"/>
    <text x="245" y="228" text-anchor="middle" class="label">4</text>
    <rect x="280" y="205" width="70" height="35" fill="#f8f9fa"/>
    <text x="315" y="228" text-anchor="middle" class="label">6</text>
    <rect x="350" y="205" width="300" height="35" fill="#f8f9fa"/>
    <text x="500" y="228" text-anchor="middle" class="label">[0,4) ∪ [4,6) → 可见key: 0,1,2,3,4,5</text>

    <!-- 网格线 -->
    <rect x="0" y="0" width="650" height="240" class="region-box"/>
    <line x1="70" y1="0" x2="70" y2="240" class="grid"/>
    <line x1="140" y1="0" x2="140" y2="240" class="grid"/>
    <line x1="210" y1="0" x2="210" y2="240" class="grid"/>
    <line x1="280" y1="0" x2="280" y2="240" class="grid"/>
    <line x1="350" y1="0" x2="350" y2="240" class="grid"/>
    <line x1="0" y1="30" x2="650" y2="30" class="grid"/>
    <line x1="0" y1="65" x2="650" y2="65" class="grid"/>
    <line x1="0" y1="100" x2="650" y2="100" class="grid"/>
    <line x1="0" y1="135" x2="650" y2="135" class="grid"/>
    <line x1="0" y1="170" x2="650" y2="170" class="grid"/>
    <line x1="0" y1="205" x2="650" y2="205" class="grid"/>
  </g>

  <!-- ========== 第三部分：注意力Mask矩阵 ========== -->
  <text x="50" y="490" class="subtitle">3. 对应的注意力Mask矩阵 (query行 × key列, 绿色=可见, 灰色=不可见)</text>
  
  <g transform="translate(120,510)">
    <!-- 坐标轴标签 -->
    <text x="-30" y="105" text-anchor="middle" class="label" transform="rotate(-90, -30, 105)">query (pos)</text>
    <text x="105" y="-15" text-anchor="middle" class="label">key (pos)</text>

    <!-- key 轴标签 -->
    <g>
      <text x="30" y="-5" text-anchor="middle" class="label">0</text>
      <text x="60" y="-5" text-anchor="middle" class="label">1</text>
      <text x="90" y="-5" text-anchor="middle" class="label">2</text>
      <text x="120" y="-5" text-anchor="middle" class="label">3</text>
      <text x="150" y="-5" text-anchor="middle" class="label">4</text>
      <text x="180" y="-5" text-anchor="middle" class="label">5</text>
    </g>

    <!-- query 轴标签 -->
    <g>
      <text x="-10" y="22" text-anchor="end" class="label">0</text>
      <text x="-10" y="52" text-anchor="end" class="label">1</text>
      <text x="-10" y="82" text-anchor="end" class="label">2</text>
      <text x="-10" y="112" text-anchor="end" class="label">3</text>
      <text x="-10" y="142" text-anchor="end" class="label">4</text>
      <text x="-10" y="172" text-anchor="end" class="label">5</text>
    </g>

    <!-- query 0 (ctx): [0,4) -->
    <rect x="0" y="0" width="30" height="30" class="visible"/>
    <rect x="30" y="0" width="30" height="30" class="visible"/>
    <rect x="60" y="0" width="30" height="30" class="visible"/>
    <rect x="90" y="0" width="30" height="30" class="visible"/>
    <rect x="120" y="0" width="30" height="30" class="hidden"/>
    <rect x="150" y="0" width="30" height="30" class="hidden"/>

    <!-- query 1 (ctx): [0,4) -->
    <rect x="0" y="30" width="30" height="30" class="visible"/>
    <rect x="30" y="30" width="30" height="30" class="visible"/>
    <rect x="60" y="30" width="30" height="30" class="visible"/>
    <rect x="90" y="30" width="30" height="30" class="visible"/>
    <rect x="120" y="30" width="30" height="30" class="hidden"/>
    <rect x="150" y="30" width="30" height="30" class="hidden"/>

    <!-- query 2 (hist): [0,3) -->
    <rect x="0" y="60" width="30" height="30" class="visible"/>
    <rect x="30" y="60" width="30" height="30" class="visible"/>
    <rect x="60" y="60" width="30" height="30" class="visible"/>
    <rect x="90" y="60" width="30" height="30" class="hidden"/>
    <rect x="120" y="60" width="30" height="30" class="hidden"/>
    <rect x="150" y="60" width="30" height="30" class="hidden"/>

    <!-- query 3 (hist): [0,4) -->
    <rect x="0" y="90" width="30" height="30" class="visible"/>
    <rect x="30" y="90" width="30" height="30" class="visible"/>
    <rect x="60" y="90" width="30" height="30" class="visible"/>
    <rect x="90" y="90" width="30" height="30" class="visible"/>
    <rect x="120" y="90" width="30" height="30" class="hidden"/>
    <rect x="150" y="90" width="30" height="30" class="hidden"/>

    <!-- query 4 (tgt): [0,4) ∪ [4,5) -->
    <rect x="0" y="120" width="30" height="30" class="visible"/>
    <rect x="30" y="120" width="30" height="30" class="visible"/>
    <rect x="60" y="120" width="30" height="30" class="visible"/>
    <rect x="90" y="120" width="30" height="30" class="visible"/>
    <rect x="120" y="120" width="30" height="30" class="visible"/>
    <rect x="150" y="120" width="30" height="30" class="hidden"/>

    <!-- query 5 (tgt): [0,4) ∪ [4,6) -->
    <rect x="0" y="150" width="30" height="30" class="visible"/>
    <rect x="30" y="150" width="30" height="30" class="visible"/>
    <rect x="60" y="150" width="30" height="30" class="visible"/>
    <rect x="90" y="150" width="30" height="30" class="visible"/>
    <rect x="120" y="150" width="30" height="30" class="visible"/>
    <rect x="150" y="150" width="30" height="30" class="visible"/>

    <!-- 网格边框 -->
    <rect x="0" y="0" width="180" height="180" class="region-box"/>
    <line x1="30" y1="0" x2="30" y2="180" class="grid"/>
    <line x1="60" y1="0" x2="60" y2="180" class="grid"/>
    <line x1="90" y1="0" x2="90" y2="180" class="grid"/>
    <line x1="120" y1="0" x2="120" y2="180" class="grid"/>
    <line x1="150" y1="0" x2="150" y2="180" class="grid"/>
    <line x1="0" y1="30" x2="180" y2="30" class="grid"/>
    <line x1="0" y1="60" x2="180" y2="60" class="grid"/>
    <line x1="0" y1="90" x2="180" y2="90" class="grid"/>
    <line x1="0" y1="120" x2="180" y2="120" class="grid"/>
    <line x1="0" y1="150" x2="180" y2="150" class="grid"/>
  </g>

  <!-- 图例 -->
  <g transform="translate(400,530)">
    <rect x="0" y="0" width="20" height="20" class="ctx" rx="2"/>
    <text x="30" y="15" class="label">Context token</text>
    <rect x="0" y="30" width="20" height="20" class="hist" rx="2"/>
    <text x="30" y="45" class="label">History token</text>
    <rect x="0" y="60" width="20" height="20" class="tgt" rx="2"/>
    <text x="30" y="75" class="label">Target token</text>
    <rect x="0" y="100" width="20" height="20" class="visible" rx="2"/>
    <text x="30" y="115" class="label">可见 (attention allowed)</text>
    <rect x="0" y="130" width="20" height="20" class="hidden" rx="2"/>
    <text x="30" y="145" class="label">不可见 (masked)</text>
  </g>

  <!-- 规则说明 -->
  <g transform="translate(700,510)">
    <text x="0" y="0" class="subtitle" font-size="14">编码规则:</text>
    <text x="0" y="25" class="small">• <tspan fill="#3498db" font-weight="bold">Context</tspan>: 可见所有非target前缀 [seq_start, base)</text>
    <text x="0" y="45" class="small">• <tspan fill="#2ecc71" font-weight="bold">History</tspan>: 因果可见 [seq_start, pos+1)</text>
    <text x="0" y="65" class="small">• <tspan fill="#e74c3c" font-weight="bold">Target</tspan>: 双区间 = 全前缀 + 同组target因果</text>
    <text x="0" y="85" class="small">  - 区间1: [seq_start, base) - 所有context+history</text>
    <text x="0" y="105" class="small">  - 区间2: [base+groupStart, base+tgtIdx+1)</text>
    <text x="0" y="125" class="small">  - target_group_size控制组内可见范围</text>
  </g>

</svg>
