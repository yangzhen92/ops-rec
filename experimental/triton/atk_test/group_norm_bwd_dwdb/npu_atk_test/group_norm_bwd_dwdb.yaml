name: group_norm_bwd_dwdb
api: pytorch
version: v2.1
api_type: group_norm_bwd_dwdb
generate: generate_group_norm_bwd_dwdb
dtype_numbers: 5000  # ✅ 增加用例数量，确保有足够用例
outputs: 2

inputs:
  - name: DW
    type: tensor
    required: true
    dtypes:
      values: [ fp32, fp16, bf16 ]
    ranges:
      valid:
        values: [ [-10000, 10000] ]
        random_types:
          - name: nd
            mean: [0, 5000]
            std: [1, 500]
    shapes:
      dim_numbers:
        values: [ 1 ]
      dim_values:
        values: [ [32, 1024], [1025, 4096], [4097, 8192] ]
        weights: [ 0.3, 0.3, 0.4 ]
    boundary:
      has_empty: false
      has_infnan: true
      has_scalar: false
      has_upper_border: false
      has_lower_border: false

  - name: DB
    type: tensor
    required: true
    dtypes:
      values: [ fp32, fp16, bf16 ]
    ranges:
      valid:
        values: [ [-10000, 10000] ]
        random_types:
          - name: nd
            mean: [0, 5000]
            std: [1, 500]
    shapes:
      dim_numbers:
        values: [ 1 ]
      dim_values:
        #  与DW保持一致
        values: [ [32, 1024], [1025, 4096], [4097, 8192] ]
        weights: [ 0.3, 0.3, 0.4 ]
    boundary:
      has_empty: false
      has_infnan: true
      has_scalar: false
      has_upper_border: false
      has_lower_border: false

  - name: num_heads
    type: attr
    required: true
    dtypes:
      values: [ int ]
    ranges:
      valid:
        values: [ 1, 2, 4, 8 ]
