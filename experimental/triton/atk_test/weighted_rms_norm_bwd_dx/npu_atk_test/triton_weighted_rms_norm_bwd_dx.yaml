# triton_weighted_rms_norm_bwd_dx.yaml
# _weighted_rms_norm_bwd_dx 测试配置。
#
# 该 kernel 对 RMSNorm 反向传播的输入梯度 DY [N, D] 求 DX [N, D]：
#   xhat = x * rstd
#   wdy = w * dy
#   c1 = sum(xhat * wdy) / D
#   dx = (wdy - xhat * c1) * rstd
# 同时用 atomic_add 把 partial weight grad (dy * xhat) 累加到 DW [GROUP_N, D]（DW 初始化为 0）。
#
# 输入参数：
#   X: [N, D]          正向输入
#   DY: [N, D]         loss 对归一化输出的梯度
#   W: [D]             weight（每列一个标量）
#   Rstd: [N]          每行 rstd（由 fwd 产生，fp32）
#   D: int             特征维
#   eps: float         归一化 epsilon（本 kernel 内未直接使用，仅传递）
# 中间/输出 buffer（由 api 分配）：
#   DX:  [N, D]        反向输入梯度（输出）
#   DW:  [GROUP_N, D]  partial weight 梯度累加缓冲（读写，fp32）
#   Lock: [2*GROUP_N]  原子锁（int32，NPU 版本 kernel 内不再使用，保留仅对齐签名）
