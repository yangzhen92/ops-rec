    <rect x="150" y="230" width="70" height="28" fill="#34495e"/>
    <text x="185" y="248" text-anchor="middle" style="fill:white" font-weight="bold" class="label">col0</text>
    <rect x="220" y="230" width="70" height="28" fill="#34495e"/>
    <text x="255" y="248" text-anchor="middle" style="fill:white" font-weight="bold" class="label">col1</text>
